<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <link rel="stylesheet" href="../../assets/style.css">
    <script defer="" src="../../assets/notes.js"></script>
    <script defer="" src="../../assets/search.js"></script>
    <script defer="" src="../../assets/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <aside class="sidebar">
      <input id="search" type="search" aria-label="Rechercher dans les notes" placeholder="Rechercher…">
      <nav aria-label="Fichiers">
        <a href="../../index.html">Notes</a>
      </nav>
    </aside>
    <div class="shell">
      <nav class="feed-tabs" aria-label="Fils par domaine"><a href="../../index.html" data-domain="">Tout</a><a href="../../Aerospace/" data-domain="Aerospace">Aérospatial</a><a href="../../Biomedical/" data-domain="Biomédical">Biomédical</a><a href="../../Agronomie/" data-domain="Agronomie">Agronomie</a><a href="../../Biologie-speculative/" data-domain="Biologie spéculative">Biologie spéculative</a><a href="../../Travail-manuel/" data-domain="Travail manuel">Travail manuel</a><a href="../../Urbanisme/" data-domain="Urbanisme &amp; durabilité">Urbanisme</a></nav>
      <div id="search-results" hidden="" aria-live="polite"></div>
      <main class="article-main" id="main-content">
        <a class="back" href="{{domainUrl}}">← Retour au fil</a>
        <div class="article-layout">
          <article class="prose">
{{article}}
          </article>
          <aside class="connections">
            <p class="eyebrow">LIENS ENTRANTS</p>
{{related}}
          </aside>
        </div>
      </main>
    </div>
  </body>
</html>
